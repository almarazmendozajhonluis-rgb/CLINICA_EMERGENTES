<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CLINIC SYSTEM PRO</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body id="body">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold fs-3"
                href="/">

                🏥 CLINIC SYSTEM PRO

            </a>

            <!-- BOTON MOVIL -->
            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContenido">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse"
                id="navbarContenido">

                <!-- MENU DERECHA -->
                <ul class="navbar-nav ms-auto align-items-center gap-3">

                    <!-- MEDICOS -->
                    <li class="nav-item">

                        <a class="nav-link menu-link"
                            href="/medicos">

                            <i class="bi bi-heart-pulse-fill"></i>

                            Médicos

                        </a>

                    </li>

                    <!-- PACIENTES -->
                    <li class="nav-item">

                        <a class="nav-link menu-link"
                            href="/pacientes">

                            <i class="bi bi-people-fill"></i>

                            Pacientes

                        </a>

                    </li>

                    <!-- CONSULTAS -->
                    <li class="nav-item">

                        <a class="nav-link menu-link"
                            href="/consultas">

                            <i class="bi bi-file-earmark-medical-fill"></i>

                            Consultas

                        </a>

                    </li>

                    <!-- HISTORIAL -->
                    <li class="nav-item">

                        <a class="nav-link menu-link"
                            href="/historial">

                            <i class="bi bi-journal-medical"></i>

                            Historial

                        </a>

                    </li>

                    <!-- REPORTES -->
                    <li class="nav-item">

                        <a class="nav-link menu-link"
                            href="#">

                            <i class="bi bi-file-earmark-pdf-fill"></i>

                            Reportes

                        </a>

                    </li>

                    <!-- LOGIN -->
                    <li class="nav-item">

                        <a class="nav-link menu-link"
                            href="/login">

                            <i class="bi bi-person-circle"></i>

                            Login

                        </a>

                    </li>

                    <!-- CONFIGURACION -->
                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle menu-link"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown">

                            <i class="bi bi-gear-fill"></i>

                            Configuración

                        </a>

                        <!-- MENU CONFIG -->
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg p-2">

                            <!-- TEMA -->
                            <li>

                                <button class="dropdown-item"
                                    onclick="modoOscuro()">

                                    🌙 Tema Claro/Oscuro

                                </button>

                            </li>

                            <!-- IDIOMA -->
                            <li>

                                <a class="dropdown-item"
                                    href="#">

                                    🌎 Cambiar Idioma

                                </a>

                            </li>

                            <!-- CUENTA -->
                            <li>

                                <a class="dropdown-item"
                                    href="#">

                                    👤 Mi Cuenta

                                </a>

                            </li>

                            <!-- DATOS -->
                            <li>

                                <a class="dropdown-item"
                                    href="#">

                                    📋 Datos Personales

                                </a>

                            </li>

                            <!-- DIVISOR -->
                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <!-- CERRAR -->
                            <li>

                                <a class="dropdown-item text-danger"
                                    href="/logout">

                                    <i class="bi bi-box-arrow-right"></i>

                                    Cerrar Sesión

                                </a>

                            </li>

                        </ul>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <div class="container mt-5 animated-container">

        {% block content %}

        {% endblock %}

    </div>

    <!-- SCRIPT DARK MODE -->
    <script>

        function modoOscuro() {

            document.body.classList.toggle('dark-mode')

        }

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
